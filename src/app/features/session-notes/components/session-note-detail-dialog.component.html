<div class="session-note-detail-dialog">
  <header class="session-note-detail-dialog__header">
    <div class="session-note-detail-dialog__header-copy">
      <span class="session-note-detail-dialog__eyebrow">Nota de sesion</span>
      <h2>{{ getTitle() }}</h2>
      <p>Lectura clinica construida con el contrato actual disponible para Session Notes.</p>

      <div class="session-note-detail-dialog__meta">
        <span>{{ sessionNote.sessionDate | date: 'dd/MM/yyyy HH:mm' }}</span>
        <span>Registrada en el sistema</span>
        <span>Seguimiento clinico asociado al expediente actual</span>
      </div>
    </div>

    <button mat-icon-button type="button" aria-label="Cerrar nota de sesion" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <div class="session-note-detail-dialog__body">
    <app-session-note-workspace [sessionNote]="sessionNote" [showActions]="false" />
  </div>

  <footer class="session-note-detail-dialog__footer">
    <div class="session-note-detail-dialog__footer-left">
      <button
        mat-stroked-button
        type="button"
        class="session-note-detail-dialog__export-btn"
        [disabled]="isGeneratingPdf()"
        (click)="openPdfPreview('NOM_004_EVOLUTION_NOTE')"
      >
        <mat-icon>picture_as_pdf</mat-icon>
        <span>Nota NOM-004</span>
      </button>
      <button
        mat-stroked-button
        type="button"
        class="session-note-detail-dialog__export-btn"
        [disabled]="isGeneratingPdf()"
        (click)="openPdfPreview('THERAPEUTIC_PRESCRIPTION')"
      >
        <mat-icon>receipt_long</mat-icon>
        <span>Receta / Indicaciones</span>
      </button>
    </div>

    <div class="session-note-detail-dialog__footer-right">
      <button
        mat-stroked-button
        class="session-note-detail-dialog__close-btn"
        type="button"
        (click)="close()"
      >
        Cerrar
      </button>
      <button
        mat-stroked-button
        type="button"
        class="session-note-detail-dialog__edit-btn"
        (click)="edit()"
      >
        <mat-icon>edit</mat-icon>
        <span>Editar</span>
      </button>
      <button
        mat-flat-button
        color="primary"
        type="button"
        class="session-note-detail-dialog__schedule-btn"
        (click)="scheduleNext()"
      >
        <mat-icon>calendar_today</mat-icon>
        <span>Programar próxima cita</span>
      </button>
    </div>
  </footer>
</div>
