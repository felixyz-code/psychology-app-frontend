<div class="branch-delete-dialog app-dialog">
  <div class="branch-delete-dialog__header app-dialog__header">
    <div class="branch-delete-dialog__icon-wrapper">
      <mat-icon>warning</mat-icon>
    </div>
    <div>
      <h2>Eliminar sede</h2>
      <p>
        ¿Estás seguro de que deseas eliminar la sede
        <strong>{{ data.branch.name }}</strong> ({{ data.branch.code }})?
      </p>
    </div>
  </div>

  <div class="branch-delete-dialog__content">
    <p class="branch-delete-dialog__warning">
      Esta acción desactivará la sede para nuevas operaciones y registros. Los datos históricos
      permanecerán resguardados.
    </p>

    @if (errorMessage()) {
      <div class="branch-delete-dialog__error" role="alert">
        <mat-icon>error_outline</mat-icon>
        <span>{{ errorMessage() }}</span>
      </div>
    }
  </div>

  <div class="branch-delete-dialog__actions app-dialog__actions">
    <button mat-button type="button" (click)="cancel()" [disabled]="isDeleting()">Cancelar</button>
    <button
      mat-flat-button
      color="warn"
      type="button"
      [disabled]="isDeleting() || isOnlyBranchError()"
      (click)="confirmDelete()"
    >
      @if (isDeleting()) {
        <mat-spinner diameter="18" />
      } @else {
        Eliminar sede
      }
    </button>
  </div>
</div>
