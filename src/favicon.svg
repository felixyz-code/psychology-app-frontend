<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="psiGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base with modern squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGradient)"/>

  <!-- Subtle Inner Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>

  <!-- Official Clinical Psychology Monogram (Psi Symbol) -->
  <g filter="url(#softGlow)" fill="none" stroke="url(#psiGradient)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Central Vertical Stem -->
    <line x1="32" y1="12" x2="32" y2="52" stroke-width="4.5"/>

    <!-- Curved Outer Wings / Cup of the Psi -->
    <path d="M 17 23 C 17 39, 47 39, 47 23" stroke-width="4.5"/>

    <!-- Bottom Base Bar -->
    <line x1="24" y1="52" x2="40" y2="52" stroke-width="4"/>

    <!-- Top Focus Node (Clinical insight / Mind apex) -->
    <circle cx="32" cy="12" r="2.5" fill="#60a5fa" stroke="#ffffff" stroke-width="1.5"/>
  </g>
</svg>
