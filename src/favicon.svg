<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="psiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Dark SaaS Base Squircle -->
  <rect width="64" height="64" rx="14" fill="url(#bgGradient)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Complete Clinical Psi Symbol (Ψ) -->
  <g stroke="url(#psiGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Continuous vertical stem -->
    <line x1="32" y1="10" x2="32" y2="52"/>
    <!-- Outer curved branches (Psi cup) -->
    <path d="M 14 20 C 14 38, 26 40, 32 40 C 38 40, 50 38, 50 20"/>
    <!-- Base horizontal pedestal -->
    <line x1="22" y1="52" x2="42" y2="52"/>
  </g>
</svg>
